[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-data-platform"
version = "0.1.0"
description = "A Formula 1 data platform built with Python, AWS and Terraform."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "pydantic>=2.0,<3.0",
    "pyarrow>=20,<23",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "respx>=0.22,<1.0",
]